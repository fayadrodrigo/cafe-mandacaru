<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { tab: "comer" };
  componentDidMount() {
    const t = localStorage.getItem("cm-cardapio-tab");
    if (t) this.setState({ tab: t });
  }
  renderVals() {
    const tab = this.state.tab;
    return {
      tab,
      tabs: [{ label: "Comer", value: "comer" }, { label: "Beber", value: "beber" }, { label: "Extras", value: "extras" }],
      setTab: (v) => { localStorage.setItem("cm-cardapio-tab", v); this.setState({ tab: v }); window.scrollTo(0, 0); },
      isComer: tab === "comer",
      isBeber: tab === "beber",
      isExtras: tab === "extras",
    };
  }
}
</script>
